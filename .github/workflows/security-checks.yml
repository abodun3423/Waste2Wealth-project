name: Waste2Wealth verification
on:
  pull_request:
    branches: [main]
  push:
    branches: ['security/**']
permissions:
  contents: read
jobs:
  backend-unit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waste2wealth-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: waste2wealth-backend/package-lock.json
      - run: npm ci --ignore-scripts --no-audit
      - run: npm test
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: waste2wealth-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: waste2wealth-frontend/package-lock.json
      - run: npm ci --no-audit
      - run: CI=false npm run build
